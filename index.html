<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #E8FF47;
    --orange: #FF6B35;
    --teal: #00D4AA;
    --purple: #C084FC;
    --slate: #94A3B8;
    --bg: #0d0d0d;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: #222;
    --text: #ffffff;
    --muted: #888;
    --dim: #555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Barlow Condensed', sans-serif; }

  /* APP SHELL */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* HEADER */
  .header {
    background: #111;
    border-bottom: 1px solid var(--border);
    padding: env(safe-area-inset-top, 12px) 16px 0;
    flex-shrink: 0;
  }
  .header-top { padding-top: 12px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; }
  .header-title { font-size: 26px; font-weight: 900; text-transform: uppercase; line-height: 1; }
  .header-title span { color: var(--yellow); }
  .header-sub { font-size: 11px; letter-spacing: 0.18em; color: var(--dim); font-family: 'Barlow', sans-serif; margin-bottom: 3px; }
  .badge { background: var(--yellow); color: #0a0a0a; padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }

  /* TABS */
  .tabs { display: flex; border-top: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; background: none; border: none; color: var(--dim); cursor: pointer; transition: all 0.2s; }
  .tab.active { color: #0a0a0a; background: var(--yellow); }

  /* SCROLLABLE CONTENT */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* DAY STRIP */
  .day-strip { display: flex; overflow-x: auto; background: #111; border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-btn { flex-shrink: 0; width: 52px; padding: 12px 4px; border: none; background: none; color: var(--dim); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; border-right: 1px solid var(--border); transition: all 0.2s; }
  .day-btn .day-label { font-size: 14px; font-weight: 900; }
  .day-btn .day-tag { font-size: 8px; letter-spacing: 0.1em; }
  .day-btn.active { color: #0a0a0a; }

  /* DAY HEADER */
  .day-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .day-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .day-tag-badge { padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; }
  .day-name { font-size: 24px; font-weight: 900; text-transform: uppercase; line-height: 1; }
  .day-focus { font-size: 12px; color: var(--muted); font-family: 'Barlow', sans-serif; margin-top: 2px; }
  .warmup-box { padding: 10px 12px; background: var(--surface); border-left: 3px solid var(--dim); }
  .box-label { font-size: 9px; letter-spacing: 0.18em; color: var(--dim); margin-bottom: 4px; }
  .box-text { font-size: 12px; color: #aaa; font-family: 'Barlow', sans-serif; line-height: 1.5; }

  /* EXERCISES */
  .ex-list { padding-bottom: 16px; }
  .ex-row { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
  .ex-row:active { background: var(--surface2); }
  .ex-num { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; flex-shrink: 0; background: var(--surface2); color: var(--dim); transition: all 0.2s; }
  .ex-num.open { color: #0a0a0a; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .ex-stats { display: flex; gap: 10px; align-items: center; margin-top: 2px; }
  .stat { text-align: center; }
  .stat-val { font-size: 16px; font-weight: 900; line-height: 1; }
  .stat-lbl { font-size: 8px; color: var(--dim); letter-spacing: 0.1em; }
  .stat-sep { color: var(--border); font-size: 18px; }
  .ex-chevron { font-size: 10px; color: var(--dim); flex-shrink: 0; transition: all 0.2s; }
  .ex-chevron.open { color: var(--yellow); }

  /* EXPANDED EXERCISE */
  .ex-detail { padding: 10px 16px 14px 54px; background: #111; border-bottom: 1px solid var(--border); border-left: 3px solid var(--yellow); display: none; }
  .ex-detail.open { display: block; }
  .ex-detail .box-text { font-size: 13px; }

  /* COOLDOWN */
  .cooldown-box { margin: 0 16px 16px; padding: 12px; background: var(--surface); border-left: 3px solid var(--border); }

  /* REST TIMER */
  .timer-bar { background: #111; border-top: 1px solid var(--border); padding: 10px 16px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .timer-display { font-size: 28px; font-weight: 900; color: var(--yellow); min-width: 72px; letter-spacing: -0.02em; }
  .timer-display.running { color: var(--teal); }
  .timer-display.done { color: var(--orange); }
  .timer-label { font-size: 10px; color: var(--dim); letter-spacing: 0.12em; font-family: 'Barlow', sans-serif; }
  .timer-btns { display: flex; gap: 6px; margin-left: auto; }
  .timer-btn { padding: 8px 14px; border: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; cursor: pointer; }
  .timer-btn.primary { background: var(--yellow); color: #0a0a0a; }
  .timer-btn.secondary { background: var(--surface2); color: var(--muted); }
  .timer-presets { display: flex; gap: 4px; }
  .preset-btn { padding: 6px 8px; border: 1px solid var(--border); background: none; color: var(--dim); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; }
  .preset-btn:active { background: var(--surface2); }

  /* PROGRESSION TAB */
  .prog-content { padding: 16px; }
  .section-title { font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 4px; }
  .section-title span { color: var(--yellow); }
  .section-sub { font-size: 13px; color: var(--muted); font-family: 'Barlow', sans-serif; margin-bottom: 16px; line-height: 1.5; }
  .prog-card { background: var(--surface); border-left: 4px solid; padding: 14px; margin-bottom: 10px; }
  .prog-week { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; margin-bottom: 6px; }
  .prog-phase { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .prog-tip { font-size: 13px; color: #aaa; font-family: 'Barlow', sans-serif; line-height: 1.6; }
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .metric-card { background: var(--surface); padding: 12px; }
  .metric-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .metric-target { font-size: 12px; color: var(--yellow); font-family: 'Barlow', sans-serif; }

  /* NUTRITION TAB */
  .nut-content { padding: 16px; }
  .nut-card { background: var(--surface); border-left: 4px solid; padding: 14px; margin-bottom: 10px; }
  .nut-card-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .nut-card-body { font-size: 13px; color: #aaa; font-family: 'Barlow', sans-serif; line-height: 1.65; }
  .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .macro-card { background: var(--surface); padding: 12px 8px; text-align: center; }
  .macro-val { font-size: 22px; font-weight: 900; color: var(--yellow); }
  .macro-unit { font-size: 10px; color: var(--dim); letter-spacing: 0.1em; }
  .macro-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .macro-kcal { font-size: 10px; color: var(--muted); font-family: 'Barlow', sans-serif; margin-top: 1px; }
  .calorie-banner { background: #1a1600; border: 1px solid #3a3000; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .calorie-num { font-size: 36px; font-weight: 900; color: var(--yellow); line-height: 1; }
  .calorie-info { flex: 1; }
  .calorie-label { font-size: 10px; letter-spacing: 0.15em; color: #888; margin-bottom: 2px; }
  .calorie-desc { font-size: 12px; color: #aaa; font-family: 'Barlow', sans-serif; line-height: 1.4; }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .content > * { animation: fadeIn 0.25s ease; }

  /* TIMER RING */
  .timer-ring-wrap { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
  .timer-ring { transform: rotate(-90deg); }
  .timer-ring-bg { fill: none; stroke: var(--surface2); stroke-width: 3; }
  .timer-ring-fill { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-sub">STEPHEN · 25 · MALE · 186CM</div>
        <div class="header-title">Athletic <span>Plan</span></div>
      </div>
      <div class="badge">6-DAY</div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('plan')">Plan</button>
      <button class="tab" onclick="switchTab('progression')">Progression</button>
      <button class="tab" onclick="switchTab('nutrition')">Nutrition</button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="timer-bar" id="timerBar">
    <div class="timer-ring-wrap">
      <svg class="timer-ring" width="36" height="36" viewBox="0 0 36 36">
        <circle class="timer-ring-bg" cx="18" cy="18" r="15"/>
        <circle class="timer-ring-fill" id="timerRing" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"/>
      </svg>
    </div>
    <div>
      <div class="timer-display" id="timerDisplay">0:00</div>
      <div class="timer-label">REST TIMER</div>
    </div>
    <div>
      <div class="timer-presets">
        <button class="preset-btn" onclick="setTimer(45)">45s</button>
        <button class="preset-btn" onclick="setTimer(60)">1m</button>
        <button class="preset-btn" onclick="setTimer(90)">90s</button>
        <button class="preset-btn" onclick="setTimer(120)">2m</button>
        <button class="preset-btn" onclick="setTimer(180)">3m</button>
      </div>
    </div>
    <div class="timer-btns">
      <button class="timer-btn secondary" onclick="resetTimer()">↺</button>
      <button class="timer-btn primary" id="timerStartBtn" onclick="toggleTimer()">START</button>
    </div>
  </div>
</div>

const PROG = [
  {week:"Weeks 1–4", phase:"Foundation", color:"#E8FF47", textColor:"#0a0a0a", tip:"Learn the movements. Use weights where you can complete all reps with perfect form. Technique before load, always."},

  {title:"Daily Calorie Target", color:"#E8FF47", body:"2,400–2,600 kcal per day. This puts you in a ~500 kcal deficit from your estimated TDEE of ~3,000. Aim for 0.5–0.75kg of fat loss per week. On heavy training days (Mon/Thu/Fri) sit at 2,600. Rest day (Sun) drop to 2,200."},

  {title:"Blood Pressure 140/90 — Act Now", color:"#FF6B35", body:"This is Stage 1 hypertension at 25. Reduce sodium: watch processed food, restaurant meals, added salt. The Zone 2 cardio sessions and fat loss will directly lower BP. Recheck in 6–8 weeks. If unchanged, see your GP."},
];

let activeDay = 0;
let activeTab = 'plan';
let expandedEx = null;
let timerSeconds = 0;
let timerTotal = 0;
let timerRunning = false;
let timerInterval = null;

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['plan','progression','nutrition'][i] === tab);
  });
  document.getElementById('timerBar').style.display = tab === 'plan' ? 'flex' : 'none';
  render();
}

function setDay(idx) {
  activeDay = idx;
  expandedEx = null;
  render();
  // scroll day strip to show active
  const strip = document.querySelector('.day-strip');
  const btns = strip.querySelectorAll('.day-btn');
  if(btns[idx]) btns[idx].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function toggleEx(idx) {
  expandedEx = expandedEx === idx ? null : idx;
  render();
}

function setTimer(secs) {
  resetTimer();
  timerSeconds = secs;
  timerTotal = secs;
  updateTimerDisplay();
}

function toggleTimer() {
  if(timerSeconds === 0) return;
  timerRunning = !timerRunning;
  document.getElementById('timerStartBtn').textContent = timerRunning ? 'PAUSE' : 'START';
  if(timerRunning) {
    timerInterval = setInterval(() => {
      timerSeconds--;
      updateTimerDisplay();
      if(timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timerStartBtn').textContent = 'START';
        document.getElementById('timerDisplay').className = 'timer-display done';
        // vibrate if supported
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      }
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  timerTotal = 0;
  document.getElementById('timerStartBtn').textContent = 'START';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  const ring = document.getElementById('timerRing');
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.className = 'timer-display' + (timerRunning ? ' running' : timerSeconds === 0 && timerTotal > 0 ? ' done' : '');
  // update ring
  const circumference = 94.25;
  const progress = timerTotal > 0 ? timerSeconds / timerTotal : 0;
  ring.style.strokeDashoffset = circumference * (1 - progress);
  ring.style.stroke = timerRunning ? '#00D4AA' : timerSeconds === 0 && timerTotal > 0 ? '#FF6B35' : '#333';
}

function render() {
  const content = document.getElementById('content');
  if(activeTab === 'plan') content.innerHTML = renderPlan();
  else if(activeTab === 'progression') content.innerHTML = renderProgression();
  else content.innerHTML = renderNutrition();
}

function renderPlan() {
  const d = DAYS[activeDay];
  const c = d.color;
  const tc = d.textColor;

  let strip = '<div class="day-strip">';
  DAYS.forEach((day, i) => {
    strip += `<button class="day-btn${i===activeDay?' active':''}" onclick="setDay(${i})" style="${i===activeDay?`background:${day.color};color:${day.textColor};`:''}">
      <span class="day-label">${day.label}</span>
      <span class="day-tag">${day.tag}</span>
    </button>`;
  });
  strip += '</div>';

  let header = `<div class="day-header" style="background: linear-gradient(135deg, ${c}18 0%, #0d0d0d 70%)">
    <div class="day-title-row">
      <div class="day-tag-badge" style="background:${c};color:${tc}">${d.tag}</div>
      <div>
        <div class="day-name">${d.name}</div>
        <div class="day-focus">${d.focus}</div>
      </div>
    </div>
    ${d.warmup !== '—' ? `<div class="warmup-box" style="border-left-color:${c}40">
      <div class="box-label">WARM-UP</div>
      <div class="box-text">${d.warmup}</div>
    </div>` : ''}
  </div>`;

  let exList = '<div class="ex-list">';
  d.exercises.forEach((ex, i) => {
    const isOpen = expandedEx === i;
    exList += `<div class="ex-row" onclick="toggleEx(${i})">
      <div class="ex-num${isOpen?' open':''}" style="${isOpen?`background:${c};color:${tc};`:''}">
        ${i+1}
      </div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
      </div>
      <div class="ex-stats">
        <div class="stat">
          <div class="stat-val" style="color:${c}">${ex.sets}</div>
          <div class="stat-lbl">SETS</div>
        </div>
        <div class="stat-sep">×</div>
        <div class="stat">
          <div class="stat-val">${ex.reps}</div>
          <div class="stat-lbl">REPS</div>
        </div>
        ${ex.rest !== '—' ? `<div class="stat-sep" style="font-size:14px">·</div>
        <div class="stat">
          <div class="stat-val" style="font-size:12px;color:var(--muted)">${ex.rest}</div>
          <div class="stat-lbl">REST</div>
        </div>` : ''}
      </div>
      <div class="ex-chevron${isOpen?' open':''}">${isOpen?'▲':'▼'}</div>
    </div>
    <div class="ex-detail${isOpen?' open':''}" style="border-left-color:${c}">
      <div class="box-label">COACHING CUE</div>
      <div class="box-text">${ex.notes}</div>
    </div>`;
  });
  exList += '</div>';

  let cooldown = `<div class="cooldown-box">
    <div class="box-label">COOL-DOWN</div>
    <div class="box-text">${d.cooldown}</div>
  </div>`;

  return strip + header + exList + cooldown;
}

function renderProgression() {
  let html = '<div class="prog-content">';
  html += `<div class="section-title">Progressive <span>Overload</span></div>
  <div class="section-sub">Do more over time. Track your lifts every single session. Progress is not optional — it's the entire point.</div>`;

  PROG.forEach(p => {
    html += `<div class="prog-card" style="border-left-color:${p.color}">
      <div class="prog-week" style="background:${p.color};color:${p.textColor}">${p.week}</div>
      <div class="prog-phase">${p.phase}</div>
      <div class="prog-tip">${p.tip}</div>
    </div>`;
  });

  html += `<div class="section-title" style="margin-top:20px">Key <span>Metrics</span></div>
  <div class="section-sub">Track these numbers. They don't lie.</div>
  <div class="metrics-grid">`;
  [
    {m:"1RM Squat", t:"+20–30kg / 12 wks"},
    {m:"1RM Deadlift", t:"+25–35kg / 12 wks"},
    {m:"Pull-Up Reps", t:"Bodyweight 10+"},
    {m:"Bench Press", t:"+15–25kg / 12 wks"},
    {m:"Sprint 20m", t:"Track & improve"},
    {m:"Waist (cm)", t:"Target <90cm"},
  ].forEach(m => {
    html += `<div class="metric-card">
      <div class="metric-name">${m.m}</div>
      <div class="metric-target">${m.t}</div>
    </div>`;
  });
  html += '</div></div>';
  return html;
}

function renderNutrition() {
  let html = '<div class="nut-content">';
  html += `<div class="section-title">Fuel the <span>Machine</span></div>
  <div class="section-sub">Tailored directly to your blood results and goals. 107.8kg → 85–90kg target.</div>`;

  html += `<div class="calorie-banner">
    <div>
      <div class="calorie-num">2,500</div>
      <div class="calorie-label">KCAL / DAY TARGET</div>
    </div>
    <div class="calorie-info">
      <div class="calorie-desc">~500 kcal deficit from TDEE. 0.5–0.75kg fat loss/week. Adjust up on heavy training days.</div>
    </div>
  </div>`;

  html += `<div class="macro-grid">
    <div class="macro-card">
      <div class="macro-val">170g</div>
      <div class="macro-unit">GRAMS</div>
      <div class="macro-name">Protein</div>
      <div class="macro-kcal">680 kcal</div>
    </div>
    <div class="macro-card">
      <div class="macro-val">260g</div>
      <div class="macro-unit">GRAMS</div>
      <div class="macro-name">Carbs</div>
      <div class="macro-kcal">1,040 kcal</div>
    </div>
    <div class="macro-card">
      <div class="macro-val">75g</div>
      <div class="macro-unit">GRAMS</div>
      <div class="macro-name">Fat</div>
      <div class="macro-kcal">675 kcal</div>
    </div>
  </div>`;

  NUT.forEach(n => {
    html += `<div class="nut-card" style="border-left-color:${n.color}">
      <div class="nut-card-title" style="color:${n.color}">${n.title}</div>
      <div class="nut-card-body">${n.body}</div>
    </div>`;
  });

  html += '</div>';
  return html;
}

// Init
render();
updateTimerDisplay();
</script>
</body>
</html>
